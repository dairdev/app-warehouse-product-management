name: Build & Deploy to Subdomain (/public_html/tienda)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Frontend & Deploy to /public_html/tienda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 1: Configure production .env using GitHub Secrets
      # -----------------------------------------------------------------------
      - name: Generate .env from GitHub Secrets
        env:
          DOT_ENV: ${{ secrets.DOT_ENV || secrets.ENV_FILE }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CHARSET: ${{ secrets.DB_CHARSET }}
          DB_PATH: ${{ secrets.DB_PATH }}
          APP_URL: ${{ secrets.APP_URL }}
          APP_ENV: ${{ secrets.APP_ENV }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "# Auto-generated .env from GitHub Secrets" > .env
          echo "# Generated: $(date -u)" >> .env

          # 1. Si existe un secreto que contiene el archivo .env completo (DOT_ENV o ENV_FILE)
          if [ -n "$DOT_ENV" ]; then
            echo "$DOT_ENV" >> .env
            echo "Loaded entire .env from secret DOT_ENV / ENV_FILE."
          else
            # 2. Ensamblar .env a partir de secretos individuales
            if [ -n "$DB_CONNECTION" ]; then
              echo "DB_CONNECTION=\"$DB_CONNECTION\"" >> .env
            elif [ -n "$DB_HOST" ] && [ -n "$DB_NAME" ]; then
              echo "DB_CONNECTION=\"mysql\"" >> .env
            else
              echo "DB_CONNECTION=\"sqlite\"" >> .env
            fi

            if [ -n "$DB_HOST" ]; then echo "DB_HOST=\"$DB_HOST\"" >> .env; fi
            if [ -n "$DB_PORT" ]; then echo "DB_PORT=\"$DB_PORT\"" >> .env; else echo "DB_PORT=\"3306\"" >> .env; fi
            if [ -n "$DB_NAME" ]; then echo "DB_NAME=\"$DB_NAME\"" >> .env; fi
            if [ -n "$DB_USER" ]; then echo "DB_USER=\"$DB_USER\"" >> .env; fi
            if [ -n "$DB_PASSWORD" ]; then echo "DB_PASSWORD=\"$DB_PASSWORD\"" >> .env; fi
            if [ -n "$DB_CHARSET" ]; then echo "DB_CHARSET=\"$DB_CHARSET\"" >> .env; else echo "DB_CHARSET=\"utf8mb4\"" >> .env; fi
            if [ -n "$DB_PATH" ]; then echo "DB_PATH=\"$DB_PATH\"" >> .env; fi
            if [ -n "$APP_URL" ]; then echo "APP_URL=\"$APP_URL\"" >> .env; fi
            if [ -n "$APP_ENV" ]; then echo "APP_ENV=\"$APP_ENV\"" >> .env; else echo "APP_ENV=\"production\"" >> .env; fi
            if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY=\"$GEMINI_API_KEY\"" >> .env; fi
          fi

          # Replicar a backend/.env para compatibilidad con la API de PHP
          mkdir -p backend
          cp .env backend/.env
          echo "Production .env created successfully with secrets!"

      # -----------------------------------------------------------------------
      # Step 2: Set up Node.js and build Vite React frontend
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Frontend SPA into backend/public/
        run: npm run build

      # -----------------------------------------------------------------------
      # Step 3: Set up PHP and install Slim Framework production dependencies
      # -----------------------------------------------------------------------
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_mysql, curl

      - name: Install Composer Dependencies (Production)
        working-directory: ./backend
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          fi

      # -----------------------------------------------------------------------
      # Step 4: Prepare complete deployment package for /public_html/tienda
      # -----------------------------------------------------------------------
      - name: Prepare Unified Deployment Package
        run: |
          mkdir -p dist_tienda/assets
          mkdir -p dist_tienda/src
          mkdir -p dist_tienda/data

          # 1. Copiar Frontend SPA (HTML, JS, CSS y Favicons compilados)
          cp backend/public/index.html dist_tienda/index.html
          cp -r backend/public/assets/* dist_tienda/assets/
          if [ -f backend/public/favicon.svg ]; then cp backend/public/favicon.svg dist_tienda/; fi
          if [ -f backend/public/favicon.ico ]; then cp backend/public/favicon.ico dist_tienda/; fi

          # 2. Copiar Backend Slim PHP (index.php, .htaccess, controladores y rutas)
          cp backend/public/index.php dist_tienda/index.php
          if [ -f backend/public/.htaccess ]; then cp backend/public/.htaccess dist_tienda/.htaccess; fi
          cp -r backend/src/* dist_tienda/src/

          # 3. Copiar archivo .env generado desde GitHub Secrets a producción
          if [ -f .env ]; then
            cp .env dist_tienda/.env
            echo "Copied .env to dist_tienda/.env"
          fi

          # 4. Copiar configuración de datos segura y carpeta de uploads
          if [ -f backend/data/.htaccess ]; then cp backend/data/.htaccess dist_tienda/data/; fi
          if [ -f backend/data/ferreteria.sqlite ]; then cp backend/data/ferreteria.sqlite dist_tienda/data/; fi
          if [ -f backend/composer.json ]; then cp backend/composer.json dist_tienda/; fi

          # 5. Carpeta de subida de imágenes/videos segura
          mkdir -p dist_tienda/uploads
          if [ -f backend/public/uploads/.htaccess ]; then cp backend/public/uploads/.htaccess dist_tienda/uploads/; fi
          if [ -f backend/public/uploads/.gitkeep ]; then cp backend/public/uploads/.gitkeep dist_tienda/uploads/; fi

          # Copiar imágenes iniciales del catálogo a dist_tienda/uploads/ y dist_tienda/assets/
          if [ -d backend/public/uploads ]; then
            cp -r backend/public/uploads/* dist_tienda/uploads/ 2>/dev/null || true
          fi
          if [ -d src/assets/images ]; then
            cp -r src/assets/images/* dist_tienda/uploads/ 2>/dev/null || true
          fi

          echo "Unified deployment package prepared successfully!"
          ls -la dist_tienda/
          ls -la dist_tienda/assets/
          ls -la dist_tienda/uploads/

      # -----------------------------------------------------------------------
      # Step 5: Guardar artefacto consolidado en GitHub Actions (Descargable)
      # -----------------------------------------------------------------------
      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subdomain-tienda-package
          path: dist_tienda/
          retention-days: 7

      # -----------------------------------------------------------------------
      # Step 6: Despliegue Unificado vía FTP a /public_html/tienda
      # Sube atómicamente el Frontend (JS/CSS/HTML) y el Backend (PHP) juntos
      # en una sola sesión sincronizada para evitar que se borren entre sí.
      # -----------------------------------------------------------------------
      - name: Deploy Complete App (Frontend + Slim PHP) via FTP
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist_tienda/
          server-dir: public_html/tienda/
          security: strict
          timeout: 600000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            data/*.sqlite-journal
            **/vendor/**

  