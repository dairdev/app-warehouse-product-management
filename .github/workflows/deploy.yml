name: Build & Deploy to Subdomain (/public_html/tienda)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Frontend & Deploy to /public_html/tienda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 1: Set up Node.js and build Vite React frontend
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Frontend SPA into backend/public/
        run: npm run build

      # -----------------------------------------------------------------------
      # Step 2: Set up PHP and install Slim Framework production dependencies
      # -----------------------------------------------------------------------
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, curl

      - name: Install Composer Dependencies (Production)
        working-directory: ./backend
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          fi

      # -----------------------------------------------------------------------
      # Step 3: Prepare complete deployment package for /public_html/tienda
      # -----------------------------------------------------------------------
      - name: Prepare Unified Deployment Package
        run: |
          mkdir -p dist_tienda/assets
          mkdir -p dist_tienda/src
          mkdir -p dist_tienda/data

          # 1. Copiar Frontend SPA (HTML, JS, CSS y Favicons compilados)
          cp backend/public/index.html dist_tienda/index.html
          cp -r backend/public/assets/* dist_tienda/assets/
          if [ -f backend/public/favicon.svg ]; then cp backend/public/favicon.svg dist_tienda/; fi
          if [ -f backend/public/favicon.ico ]; then cp backend/public/favicon.ico dist_tienda/; fi

          # 2. Copiar Backend Slim PHP (index.php, .htaccess, controladores y rutas)
          cp backend/public/index.php dist_tienda/index.php
          if [ -f backend/public/.htaccess ]; then cp backend/public/.htaccess dist_tienda/.htaccess; fi
          cp -r backend/src/* dist_tienda/src/

          # 3. Copiar configuración de datos segura
          if [ -f backend/data/.htaccess ]; then cp backend/data/.htaccess dist_tienda/data/; fi
          if [ -f backend/data/ferreteria.sqlite ]; then cp backend/data/ferreteria.sqlite dist_tienda/data/; fi
          if [ -f backend/composer.json ]; then cp backend/composer.json dist_tienda/; fi

          echo "Unified deployment package prepared successfully!"
          ls -la dist_tienda/
          ls -la dist_tienda/assets/

      # -----------------------------------------------------------------------
      # Step 4: Guardar artefacto consolidado en GitHub Actions (Descargable)
      # -----------------------------------------------------------------------
      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subdomain-tienda-package
          path: dist_tienda/
          retention-days: 7

      # -----------------------------------------------------------------------
      # Step 5: Despliegue Unificado vía FTP a /public_html/tienda
      # Sube atómicamente el Frontend (JS/CSS/HTML) y el Backend (PHP) juntos
      # en una sola sesión sincronizada para evitar que se borren entre sí.
      # -----------------------------------------------------------------------
      - name: Deploy Complete App (Frontend + Slim PHP) via FTP
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist_tienda/
          server-dir: public_html/tienda/
          security: strict
          timeout: 600000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            data/*.sqlite-journal
            **/vendor/**

  