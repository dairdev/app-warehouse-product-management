name: Build & Deploy to Subdomain (/public_html/tienda)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Frontend & Deploy to /public_html/tienda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 1: Set up Node.js and build Vite React frontend
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Frontend SPA into backend/public/
        run: npm run build

      # -----------------------------------------------------------------------
      # Step 2: Set up PHP and install Slim Framework production dependencies
      # -----------------------------------------------------------------------
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, curl

      - name: Install Composer Dependencies (Production)
        working-directory: ./backend
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          fi

      # -----------------------------------------------------------------------
      # Step 3: Prepare deployment packages (Frontend SPA + Backend PHP separated)
      # -----------------------------------------------------------------------
      - name: Prepare Deployment Packages
        run: |
          # 1. Paquete Frontend SPA (HTML, JS, CSS, Favicons y Assets compilados de Vite)
          mkdir -p dist_tienda_frontend/assets
          cp backend/public/index.html dist_tienda_frontend/index.html
          cp -r backend/public/assets/* dist_tienda_frontend/assets/
          if [ -f backend/public/favicon.svg ]; then cp backend/public/favicon.svg dist_tienda_frontend/; fi
          if [ -f backend/public/favicon.ico ]; then cp backend/public/favicon.ico dist_tienda_frontend/; fi

          # 2. Paquete Backend PHP (Slim 4 API, .htaccess, controladores y SQLite)
          mkdir -p dist_tienda_backend/src
          cp backend/public/index.php dist_tienda_backend/index.php
          if [ -f backend/public/.htaccess ]; then cp backend/public/.htaccess dist_tienda_backend/.htaccess; fi
          cp -r backend/src/* dist_tienda_backend/src/
          
          mkdir -p dist_tienda_backend/data
          if [ -f backend/data/.htaccess ]; then cp backend/data/.htaccess dist_tienda_backend/data/; fi
          if [ -f backend/data/ferreteria.sqlite ]; then cp backend/data/ferreteria.sqlite dist_tienda_backend/data/; fi
          if [ -f backend/composer.json ]; then cp backend/composer.json dist_tienda_backend/; fi

          # 3. Paquete Completo consolidado para descarga de artefacto GitHub
          mkdir -p dist_tienda
          cp -R dist_tienda_frontend/* dist_tienda/
          cp -R dist_tienda_backend/* dist_tienda/
          if [ -d backend/vendor ]; then
            cp -R backend/vendor dist_tienda/vendor
          fi

          echo "Deployment packages prepared successfully!"
          echo "Frontend files:" && ls -la dist_tienda_frontend/
          echo "Backend files:" && ls -la dist_tienda_backend/

      # -----------------------------------------------------------------------
      # Step 4: Guardar artefacto consolidado en GitHub Actions (Descargable)
      # -----------------------------------------------------------------------
      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subdomain-tienda-package
          path: dist_tienda/
          retention-days: 7

      # -----------------------------------------------------------------------
      # Step 5A: Despliegue FTP Paso 1 - Frontend SPA (JS, CSS, HTML, Favicons)
      # Sube rápidamente los bundles estáticos de React sin saturar el socket
      # -----------------------------------------------------------------------
      - name: Deploy Frontend Assets via FTP
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist_tienda_frontend/
          server-dir: public_html/tienda/
          security: loose
          timeout: 180000

      # -----------------------------------------------------------------------
      # Step 5B: Despliegue FTP Paso 2 - Backend Slim PHP (index.php, .htaccess, src/)
      # Sube la lógica de la API PHP y rutas de forma limpia e independiente
      # -----------------------------------------------------------------------
      - name: Deploy Backend PHP via FTP
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist_tienda_backend/
          server-dir: public_html/tienda/
          security: loose
          timeout: 180000
          exclude: |
            **/.git*
            **/.git*/**
            data/*.sqlite-journal
            **/vendor/**

  