<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background tile with subtle border -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect x="2.5" y="2.5" width="95" height="95" rx="22" stroke="#eab308" stroke-width="2.5" stroke-opacity="0.35" fill="none" />

  <!-- Outer House Geometry (Ferretería & Construcción) -->
  <path
    d="M 24 74 L 24 40 L 50 20 L 76 40 L 76 74 Z"
    stroke="url(#amberGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Stylized "N" Letter Beam (Nor Oriente) -->
  <path
    d="M 37 72 L 37 36 L 63 68 L 63 32"
    stroke="url(#yellowGrad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Accent Detail -->
  <circle cx="37" cy="72" r="2.5" fill="#fde047" />
  <circle cx="63" cy="32" r="2.5" fill="#fde047" />
</svg>
